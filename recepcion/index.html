<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panorama Café · Recepción</title><style>:root{--bg:#f4eee3;--ink:#241912;--muted:#76695c;--card:#fffdf9;--line:#e1d5c4;--green:#2f5d50;--red:#a7443c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif}header{background:var(--ink);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:5}header>div{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}small{color:#d7cabb}.wrap{max-width:1200px;margin:auto;padding:16px}.notice{background:#eee5d7;border-radius:12px;padding:10px 12px;margin-bottom:14px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{background:#e9e0d2;border-radius:15px;padding:10px;min-height:300px}.col h2{font-size:14px;margin:2px 4px 10px}.count{float:right;background:#fff;border-radius:999px;padding:2px 7px}.order{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;box-shadow:0 2px 7px #0000000d}.top{display:flex;justify-content:space-between;gap:8px}.id{font-weight:900}.time{font-size:11px;color:var(--muted)}.customer{margin:8px 0;font-weight:800}.meta{font-size:12px;color:var(--muted);line-height:1.45}.items{border-top:1px solid var(--line);margin-top:8px;padding-top:7px}.item{padding:5px 0}.mods{font-size:11px;color:var(--muted);margin-left:19px}.note{background:#f6ead2;padding:7px;border-radius:8px;font-size:11px;margin-top:7px}.total{font-weight:900;margin-top:8px}.actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:8px 10px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}button.alt{background:#e4d9c8;color:var(--ink)}button.danger{background:var(--red)}.empty{color:var(--muted);font-size:12px;padding:20px 5px;text-align:center}@media(max-width:900px){.board{grid-template-columns:1fr 1fr}}@media(max-width:600px){.board{grid-template-columns:1fr}.col{min-height:120px}}</style></head><body><header><div><div><h1>Panorama Café · Recepción de pedidos</h1><small>Pedidos enviados por clientes</small></div><button class="alt" onclick="location.href='../'">Ver menú</button></div></header><div class="wrap"><div id="notice" class="notice">Conectando con pedidos…</div><div class="board"><section class="col"><h2>Nuevos <span class="count" id="c-new">0</span></h2><div id="new"></div></section><section class="col"><h2>Aceptados <span class="count" id="c-accepted">0</span></h2><div id="accepted"></div></section><section class="col"><h2>Preparando <span class="count" id="c-preparing">0</span></h2><div id="preparing"></div></section><section class="col"><h2>Listos / Completados <span class="count" id="c-done">0</span></h2><div id="done"></div></section></div></div><script src="../firebase-config.js?v=20260904"></script><script src="../catalog-store.js?v=20260904"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let orders=[];function colFor(o){if(o.status==='pending_confirmation')return'new';if(o.status==='accepted')return'accepted';if(o.status==='preparing')return'preparing';return'done'}function card(o){const items=(o.items||[]).map(i=>'<div class="item"><b>'+esc(i.quantity)+'×</b> '+esc(i.product)+(i.variant?' · '+esc(i.variant):'')+(i.modifiers?.length?'<div class="mods">'+i.modifiers.map(m=>esc(m.name)+(m.price==null?' (confirmar)':(m.price>0?' +$'+Number(m.price).toFixed(2):''))).join(' · ')+'</div>':'')+'</div>').join('');let next='';if(o.status==='pending_confirmation')next='<button onclick="status(\''+o.orderId+'\',\'accepted\')">Aceptar</button><button class="danger" onclick="status(\''+o.orderId+'\',\'cancelled\')">Cancelar</button>';else if(o.status==='accepted')next='<button onclick="status(\''+o.orderId+'\',\'preparing\')">Preparar</button>';else if(o.status==='preparing')next='<button onclick="status(\''+o.orderId+'\',\'ready\')">Marcar listo</button>';else if(o.status==='ready')next='<button onclick="status(\''+o.orderId+'\',\'completed\')">Completar</button>';return'<article class="order"><div class="top"><span class="id">'+esc(o.orderId)+'</span><span class="time">'+new Date(o.createdAt).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})+'</span></div><div class="customer">'+esc(o.customer?.name||'Cliente')+'</div><div class="meta">'+(o.fulfillment?.type==='dinein'?'Mesa '+esc(o.fulfillment.table||'?'):'Para llevar')+(o.customer?.phone?' · '+esc(o.customer.phone):'')+'</div><div class="items">'+items+'</div>'+(o.note?'<div class="note">Nota: '+esc(o.note)+'</div>':'')+'<div class="total">'+(o.pricing?.total==null?'Precio a confirmar':'$'+Number(o.pricing.total).toFixed(2))+(o.pricing?.hasVariableItems?' + por confirmar':'')+'</div><div class="actions">'+next+'</div></article>'}function render(){['new','accepted','preparing','done'].forEach(k=>{const box=$(k),list=orders.filter(o=>colFor(o)===k&&o.status!=='cancelled').sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));box.innerHTML=list.length?list.map(card).join(''):'<div class="empty">Sin pedidos</div>';$(k==='new'?'c-new':k==='accepted'?'c-accepted':k==='preparing'?'c-preparing':'c-done').textContent=list.length})}async function status(id,s){try{await PanoramaCatalog.updateOrderStatus(id,s)}catch(e){alert(e.message||'No se pudo actualizar el pedido')}}if(!PanoramaCatalog.remoteConfigured()){$('notice').textContent='No hay conexión con Supabase.'}else{$('notice').textContent='Solicitando acceso de personal…';PanoramaCatalog.subscribeOrders(v=>{orders=v;render();$('notice').textContent='Conectado · '+orders.filter(o=>o.status==='pending_confirmation').length+' pedido(s) nuevo(s).'})}</script></body></html>
