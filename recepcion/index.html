<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panorama Café · Recepción</title><style>:root{--bg:#f4eee3;--ink:#241912;--muted:#76695c;--card:#fffdf9;--line:#e1d5c4;--green:#2f5d50;--red:#a7443c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif}header{background:var(--ink);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:5}header>div{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}small{color:#d7cabb}.wrap{max-width:1200px;margin:auto;padding:16px}.notice{background:#eee5d7;border-radius:12px;padding:10px 12px;margin-bottom:14px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.col{background:#e9e0d2;border-radius:15px;padding:10px;min-height:300px}.col h2{font-size:14px;margin:2px 4px 10px}.count{float:right;background:#fff;border-radius:999px;padding:2px 7px}.order{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;box-shadow:0 2px 7px #0000000d}.top{display:flex;justify-content:space-between;gap:8px}.id{font-weight:900}.time{font-size:11px;color:var(--muted)}.customer{margin:8px 0;font-weight:800}.meta{font-size:12px;color:var(--muted);line-height:1.45}.items{border-top:1px solid var(--line);margin-top:8px;padding-top:7px}.item{padding:5px 0}.mods{font-size:11px;color:var(--muted);margin-left:19px}.note{background:#f6ead2;padding:7px;border-radius:8px;font-size:11px;margin-top:7px}.total{font-weight:900;margin-top:8px}.actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:9px 12px;background:var(--green);color:#fff;font-weight:800;cursor:pointer}button.alt{background:#e4d9c8;color:var(--ink)}button.danger{background:var(--red)}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fffdf9;font:inherit;margin-top:5px}.empty{color:var(--muted);font-size:12px;padding:20px 5px;text-align:center}.modal{position:fixed;inset:0;background:#241912cc;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.panel{width:min(420px,100%);background:var(--card);border-radius:18px;padding:24px;box-shadow:0 15px 50px #0006}.panel h2{margin:0 0 6px}.panel p{color:var(--muted);line-height:1.45}.form-actions{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}.link{background:none;color:var(--green);padding:6px 0;text-decoration:underline}.msg{font-size:13px;margin-top:10px;color:var(--muted)}@media(max-width:900px){.board{grid-template-columns:1fr 1fr}}@media(max-width:600px){.board{grid-template-columns:1fr}.col{min-height:120px}}</style></head><body><header><div><div><h1>Panorama Café · Recepción de pedidos</h1><small>Pedidos enviados por clientes</small></div><div><button class="alt" onclick="PanoramaCatalog.signOut()">Cerrar sesión</button> <button class="alt" onclick="location.href='../'">Ver menú</button></div></div></header><div class="wrap"><div id="notice" class="notice">Inicia sesión para consultar pedidos.</div><div class="board"><section class="col"><h2>Nuevos <span class="count" id="c-new">0</span></h2><div id="new"></div></section><section class="col"><h2>Aceptados <span class="count" id="c-accepted">0</span></h2><div id="accepted"></div></section><section class="col"><h2>Preparando <span class="count" id="c-preparing">0</span></h2><div id="preparing"></div></section><section class="col"><h2>Listos / Completados <span class="count" id="c-done">0</span></h2><div id="done"></div></section></div></div><div id="auth" class="modal"><div class="panel" id="authPanel"></div></div><script src="../firebase-config.js?v=20260904b"></script><script src="../catalog-store.js?v=20260904b"></script><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let orders=[];const auth=$('auth'),panel=$('authPanel');function showLogin(message=''){panel.innerHTML='<h2>Acceso de personal</h2><p>Usa el correo y contraseña de <b>Supabase Authentication</b> de Panorama Café.</p><label>Correo<input id="email" type="email" autocomplete="username"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password"></label><div class="form-actions"><button onclick="login()">Iniciar sesión</button><button class="link" onclick="showRecovery()">Olvidé mi contraseña</button></div><div id="authMsg" class="msg">'+esc(message)+'</div>'}function showRecovery(message=''){panel.innerHTML='<h2>Restablecer contraseña</h2><p>Te enviaremos un correo para crear una nueva contraseña para tu usuario de Panorama Café.</p><label>Correo<input id="recoverEmail" type="email" autocomplete="email"></label><div class="form-actions"><button onclick="recover()">Enviar enlace</button><button class="link" onclick="showLogin()">Volver a iniciar sesión</button></div><div id="authMsg" class="msg">'+esc(message)+'</div>'}async function login(){const e=$('email').value.trim(),p=$('password').value,m=$('authMsg');if(!e||!p){m.textContent='Escribe correo y contraseña.';return}m.textContent='Iniciando sesión…';try{await PanoramaCatalog.signIn(e,p);auth.style.display='none';startOrders()}catch(x){m.textContent=x.message||'No se pudo iniciar sesión.'}}async function recover(){const e=$('recoverEmail').value.trim(),m=$('authMsg');if(!e){m.textContent='Escribe tu correo.';return}m.textContent='Enviando…';try{const cfg=window.PANORAMA_SUPABASE||{},url=String(cfg.url||'').replace(/\/$/,'');const redirect=location.origin+location.pathname;const r=await fetch(url+'/auth/v1/recover',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.key},body:JSON.stringify({email:e,redirect_to:redirect})});let b={};try{b=await r.json()}catch(_){}if(!r.ok)throw new Error(b?.msg||b?.error_description||'No se pudo enviar el correo.');m.textContent='Listo. Revisa tu correo y abre el enlace de recuperación. Si aparece un error de URL, avísame para ajustar la configuración de Supabase.'}catch(x){m.textContent=x.message||'No se pudo enviar el correo.'}}function colFor(o){if(o.status==='pending_confirmation')return'new';if(o.status==='accepted')return'accepted';if(o.status==='preparing')return'preparing';return'done'}function card(o){const items=(o.items||[]).map(i=>'<div class="item"><b>'+esc(i.quantity)+'×</b> '+esc(i.product)+(i.variant?' · '+esc(i.variant):'')+(i.modifiers?.length?'<div class="mods">'+i.modifiers.map(m=>esc(m.name)+(m.price==null?' (confirmar)':(m.price>0?' +$'+Number(m.price).toFixed(2):''))).join(' · ')+'</div>':'')+'</div>').join('');let next='';if(o.status==='pending_confirmation')next='<button onclick="status(\''+o.orderId+'\',\'accepted\')">Aceptar</button><button class="danger" onclick="status(\''+o.orderId+'\',\'cancelled\')">Cancelar</button>';else if(o.status==='accepted')next='<button onclick="status(\''+o.orderId+'\',\'preparing\')">Preparar</button>';else if(o.status==='preparing')next='<button onclick="status(\''+o.orderId+'\',\'ready\')">Marcar listo</button>';else if(o.status==='ready')next='<button onclick="status(\''+o.orderId+'\',\'completed\')">Completar</button>';return'<article class="order"><div class="top"><span class="id">'+esc(o.orderId)+'</span><span class="time">'+new Date(o.createdAt).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})+'</span></div><div class="customer">'+esc(o.customer?.name||'Cliente')+'</div><div class="meta">'+(o.fulfillment?.type==='dinein'?'Mesa '+esc(o.fulfillment.table||'?'):'Para llevar')+(o.customer?.phone?' · '+esc(o.customer.phone):'')+'</div><div class="items">'+items+'</div>'+(o.note?'<div class="note">Nota: '+esc(o.note)+'</div>':'')+'<div class="total">'+(o.pricing?.total==null?'Precio a confirmar':'$'+Number(o.pricing.total).toFixed(2))+(o.pricing?.hasVariableItems?' + por confirmar':'')+'</div><div class="actions">'+next+'</div></article>'}function render(){['new','accepted','preparing','done'].forEach(k=>{const box=$(k),list=orders.filter(o=>colFor(o)===k&&o.status!=='cancelled').sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));box.innerHTML=list.length?list.map(card).join(''):'<div class="empty">Sin pedidos</div>';$(k==='new'?'c-new':k==='accepted'?'c-accepted':k==='preparing'?'c-preparing':'c-done').textContent=list.length})}async function status(id,s){try{await PanoramaCatalog.updateOrderStatus(id,s)}catch(e){alert(e.message||'No se pudo actualizar el pedido')}}function startOrders(){$('notice').textContent='Conectando con pedidos…';PanoramaCatalog.subscribeOrders(v=>{orders=v;render();$('notice').textContent='Conectado · '+orders.filter(o=>o.status==='pending_confirmation').length+' pedido(s) nuevo(s).'})}function handleRecovery(){const h=new URLSearchParams(location.hash.replace(/^#/,'&')),type=h.get('type'),access=h.get('access_token'),refresh=h.get('refresh_token');if(type!=='recovery'||!access)return false;panel.innerHTML='<h2>Nueva contraseña</h2><p>Escribe una contraseña nueva para tu usuario de Panorama Café.</p><label>Nueva contraseña<input id="newPass" type="password" autocomplete="new-password"></label><label>Repetir contraseña<input id="newPass2" type="password" autocomplete="new-password"></label><div class="form-actions"><button onclick="changePassword()">Guardar contraseña</button></div><div id="authMsg" class="msg"></div>';window.__recovery={access,refresh};return true}async function changePassword(){const p=$('newPass').value,p2=$('newPass2').value,m=$('authMsg');if(p.length<6){m.textContent='La contraseña debe tener al menos 6 caracteres.';return}if(p!==p2){m.textContent='Las contraseñas no coinciden.';return}m.textContent='Guardando…';try{const cfg=window.PANORAMA_SUPABASE||{},url=String(cfg.url||'').replace(/\/$/,'');const r=await fetch(url+'/auth/v1/user',{method:'PUT',headers:{'Content-Type':'application/json','apikey':cfg.key,'Authorization':'Bearer '+window.__recovery.access},body:JSON.stringify({password:p})});let b={};try{b=await r.json()}catch(_){}if(!r.ok)throw new Error(b?.msg||b?.error_description||'No se pudo cambiar la contraseña.');history.replaceState(null,'',location.pathname);window.__recovery=null;showLogin('Contraseña actualizada. Ya puedes iniciar sesión.')}catch(x){m.textContent=x.message||'No se pudo cambiar la contraseña.'}}showLogin();if(!PanoramaCatalog.remoteConfigured()){$('notice').textContent='No hay conexión con Supabase.'}else if(PanoramaCatalog.session()&&!handleRecovery()){auth.style.display='none';startOrders()}else if(handleRecovery()){ }else{auth.style.display='flex'}</script></body></html>
