<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panorama Café — Administración</title><style>body{font-family:system-ui;margin:0;background:#f7f1e5;color:#1c1410}main{max-width:900px;margin:auto;padding:24px}h1{margin-top:0}section{background:white;padding:18px;border-radius:16px;margin:14px 0}button{padding:10px 14px;border:0;border-radius:10px;background:#2f5d50;color:white;font-weight:700}pre{white-space:pre-wrap;overflow:auto;background:#f1e9d8;padding:12px;border-radius:10px}</style></head><body><main><h1>Panorama Café · Administración</h1><p>Backoffice de prueba del catálogo. Esta interfaz es independiente de la app del cliente.</p><section><h2>Catálogo</h2><p>El catálogo comercial inicial está en <code>data/</code>. La edición avanzada se conectará al backend compartido en la siguiente etapa.</p><button onclick="location.href='../'">Abrir app cliente</button></section><section><h2>Estado de conexión</h2><pre id="out">Comprobando archivos…</pre></section></main><script>fetch('../data/cat-0.json').then(r=>r.ok?r.json():Promise.reject()).then(x=>document.querySelector('#out').textContent='Catálogo accesible correctamente. Categoría inicial: '+(x.nombre||'OK')).catch(()=>document.querySelector('#out').textContent='No se pudo leer el catálogo.');</script></body></html>
