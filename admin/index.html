<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panorama Café · Administración</title><style>:root{--bg:#f6f0e5;--ink:#241912;--muted:#786b60;--card:#fffdf9;--line:#e5dacb;--a:#2f5d50;--danger:#a7443c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif}header{background:var(--ink);color:#fff;padding:16px}header>div,main{max-width:1100px;margin:auto}header h1{margin:0;font-size:20px}header small{color:#d9cec0}main{padding:18px}.notice{background:#eee5d7;border-radius:12px;padding:11px;margin-bottom:14px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{border:0;border-radius:9px;padding:9px 12px;background:var(--a);color:white;font-weight:700;cursor:pointer}button.alt{background:#e6ddcf;color:var(--ink)}button.danger{background:var(--danger)}.layout{display:grid;grid-template-columns:260px 1fr;gap:14px}@media(max-width:700px){.layout{grid-template-columns:1fr}}section{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}.cats button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);margin:3px 0}.cats button.sel{background:#e4eee9;color:var(--a)}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;background:#fff}.row{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:12px}.tag{display:inline-block;background:#eee5d7;border-radius:20px;padding:3px 7px;font-size:11px;margin:2px}.off{background:#f1d7d3;color:#7e302b}.price{font-weight:800;margin-top:6px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:12px;padding:7px 9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}.stat b{display:block;font-size:20px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}dialog{border:0;border-radius:16px;width:min(600px,calc(100% - 24px));padding:0;box-shadow:0 20px 70px #0006}dialog::backdrop{background:#0007}.modal{padding:18px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:800}.form input,.form textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}.check{display:flex;gap:7px;align-items:center}.check input{width:auto}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}</style></head><body><header><div><h1>Panorama Café · Administración</h1><small>Este catálogo controla lo que verá el cliente</small></div></header><main><div id="notice" class="notice">Cargando catálogo…</div><div class="stats"><div class="stat"><span class="muted">Categorías</span><b id="sc">0</b></div><div class="stat"><span class="muted">Productos</span><b id="sp">0</b></div><div class="stat"><span class="muted">Disponibles</span><b id="sa">0</b></div></div><div class="tools"><button onclick="newCat()">+ Categoría</button><button onclick="newProd()">+ Producto</button><button onclick="saveRemote()">Guardar menú</button><button class="alt" onclick="resetInitial()">Restaurar inicial</button><button class="alt" onclick="location.href='../'">Ver app cliente</button><button class="alt" onclick="location.href='../recepcion/'">Ver recepción</button></div><div class="layout"><section><h3>Categorías</h3><div id="cats" class="cats"></div></section><section><div class="row"><div><h2 id="title">Catálogo</h2><div id="meta" class="muted"></div></div><button onclick="editCat()">Editar categoría</button></div><div id="items"></div></section></div></main><dialog id="dlg"><div class="modal"><h2 id="dh"></h2><div id="db"></div><div class="foot"><button class="alt" onclick="dlg.close()">Cancelar</button><button id="ok">Guardar</button></div></div></dialog><script src="../firebase-config.js"></script><script src="../catalog-store.js"></script><script>
let data=[],sel=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const slug=x=>String(x||'item').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'item';function normalize(c){return(c||[]).map((x,i)=>{x.id=x.id||slug(x.nombre||'cat-'+i);x.nombre=x.nombre||'Sin nombre';x.tagline=x.tagline||'';x.active=x.active!==false;x.items=x.items||[];x.items=x.items.map((p,j)=>{p.id=p.id||slug(p.nombre||'item-'+j);p.nombre=p.nombre||'Sin nombre';p.descripcion=p.descripcion||'';p.active=p.active!==false;p.variants=p.variants||[];p.addons=p.addons||[];return p});return x})}async function load(){data=normalize(await PanoramaCatalog.load());sel=data[0]?.id;render();if(PanoramaCatalog.remoteConfigured())$('notice').textContent='Catálogo compartido activo · los cambios guardados aquí se reflejan en la app del cliente.';else $('notice').textContent='Modo local · configura Firebase para compartir el menú entre dispositivos.';PanoramaCatalog.subscribeCatalog(c=>{data=normalize(c);if(!data.some(x=>x.id===sel))sel=data[0]?.id;render();$('notice').textContent='Catálogo actualizado desde el servidor.'})}async function saveRemote(){try{const r=await PanoramaCatalog.save(data);$('notice').textContent=r.mode==='firebase'?'Menú guardado y publicado para el cliente.':'Guardado solo en este dispositivo. Configura Firebase para compartirlo.'}catch(e){$('notice').textContent='No se pudo guardar: '+e.message}}function render(){const cts=$('cats');cts.innerHTML='';data.forEach(c=>{const b=document.createElement('button');b.className=c.id===sel?'sel':'';b.innerHTML=esc(c.nombre)+(c.active?'':' <span class="tag off">oculta</span>');b.onclick=()=>{sel=c.id;render()};cts.appendChild(b)});const c=data.find(x=>x.id===sel);$('title').textContent=c?.nombre||'Catálogo';$('meta').textContent=c?(c.items.length+' productos · '+(c.active?'visible':'oculta')):'';const box=$('items');box.innerHTML='';(c?.items||[]).forEach(p=>{const prices=p.variants.map(v=>v.precio).filter(v=>v!=null);const d=document.createElement('div');d.className='item';d.innerHTML='<div class="row"><div><b>'+esc(p.nombre)+'</b><div class="muted">'+esc(p.descripcion||'Sin descripción')+'</div></div><div>'+(p.active?'<span class="tag">Activo</span>':'<span class="tag off">Oculto</span>')+(p.ageRestricted?'<span class="tag">18+</span>':'')+'</div></div><div class="price">'+(prices.length?'$'+Math.min(...prices)+(Math.max(...prices)!==Math.min(...prices)?' – $'+Math.max(...prices):''):'Precio a confirmar')+'</div><div class="actions"><button onclick="editProd(\''+p.id+'\')">Editar</button><button class="alt" onclick="toggleProd(\''+p.id+'\')">'+(p.active?'Ocultar':'Activar')+'</button><button class="danger" onclick="delProd(\''+p.id+'\')">Eliminar</button></div>';box.appendChild(d)});$('sc').textContent=data.length;$('sp').textContent=data.reduce((n,c)=>n+c.items.length,0);$('sa').textContent=data.reduce((n,c)=>n+c.items.filter(p=>p.active!==false).length,0)}function modal(h,html,fn){$('dh').textContent=h;$('db').innerHTML=html;$('ok').onclick=()=>{fn();dlg.close();render()};dlg.showModal()}function editCat(){const c=data.find(x=>x.id===sel);if(!c)return;modal('Editar categoría','<div class="form"><label>Nombre<input id="n" value="'+esc(c.nombre)+'"></label><label>Descripción<textarea id="d">'+esc(c.tagline||'')+'</textarea></label><label class="check"><input id="a" type="checkbox" '+(c.active?'checked':'')+'> Visible para clientes</label></div>',()=>{c.nombre=$('n').value.trim()||c.nombre;c.tagline=$('d').value.trim();c.active=$('a').checked})}function newCat(){modal('Nueva categoría','<div class="form"><label>Nombre<input id="n"></label><label>Descripción<textarea id="d"></textarea></label></div>',()=>{const id=slug($('n').value)||('cat-'+Date.now());data.push({id,nombre:$('n').value.trim()||'Nueva categoría',tagline:$('d').value.trim(),items:[],active:true});sel=id})}function newProd(){if(!sel)return alert('Selecciona una categoría');editProd(null)}function editProd(pid){const c=data.find(x=>x.id===sel),p=pid?c.items.find(x=>x.id===pid):{id:'',nombre:'',descripcion:'',active:true,ageRestricted:false,variants:[{opcion:null,precio:''}],addons:[]};const price=p.variants?.[0]?.precio??'';modal(pid?'Editar producto':'Nuevo producto','<div class="form"><label>Nombre<input id="n" value="'+esc(p.nombre)+'"></label><label>ID<input id="i" value="'+esc(p.id)+'"></label><label>Descripción<textarea id="d">'+esc(p.descripcion||'')+'</textarea></label><label>Precio único<input id="pr" type="number" step="0.01" value="'+(price??'')+'"></label><label class="check"><input id="a" type="checkbox" '+(p.active?'checked':'')+'> Disponible</label><label class="check"><input id="e" type="checkbox" '+(p.ageRestricted?'checked':'')+'> Requiere confirmación de edad</label></div>',()=>{p.id=slug($('i').value||$('n').value);p.nombre=$('n').value.trim()||'Producto';p.descripcion=$('d').value.trim();p.active=$('a').checked;p.ageRestricted=$('e').checked;if($('pr').value!=='')p.variants=[{opcion:null,precio:Number($('pr').value)}];if(!pid)c.items.push(p)})}function toggleProd(id){const p=data.find(c=>c.id===sel).items.find(p=>p.id===id);p.active=!p.active;render()}function delProd(id){if(confirm('¿Eliminar este producto?')){const c=data.find(c=>c.id===sel);c.items=c.items.filter(p=>p.id!==id);render()}}async function resetInitial(){if(!confirm('¿Restaurar el menú inicial?'))return;data=normalize(await PanoramaCatalog.loadStatic());sel=data[0]?.id;await saveRemote();render()}load();
</script></body></html>
