<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panorama Café · Admin</title><style>:root{--bg:#f6f0e5;--ink:#241912;--muted:#786b60;--card:#fffdf9;--line:#e5dacb;--a:#2f5d50;--danger:#a7443c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,sans-serif}header{background:#241912;color:white;padding:16px}header>div,main{max-width:1100px;margin:auto}header h1{margin:0;font-size:20px}header small{color:#d9cec0}main{padding:18px}.note{background:#eee5d7;border-radius:12px;padding:11px;margin-bottom:14px;font-size:12px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button{border:0;border-radius:9px;padding:9px 12px;background:var(--a);color:white;font-weight:700;cursor:pointer}button.alt{background:#e6ddcf;color:var(--ink)}button.danger{background:var(--danger)}.layout{display:grid;grid-template-columns:260px 1fr;gap:14px}@media(max-width:700px){.layout{grid-template-columns:1fr}}section{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px}.cats button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);margin:3px 0}.cats button.sel{background:#e4eee9;color:var(--a)}.item{background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:12px}.tag{display:inline-block;background:#eee5d7;border-radius:20px;padding:3px 7px;font-size:11px;margin:2px}.off{background:#f1d7d3;color:#7e302b}.price{font-weight:800;margin-top:6px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:12px;padding:7px 9px}dialog{border:0;border-radius:16px;width:min(600px,calc(100% - 24px));padding:0;box-shadow:0 20px 70px #0006}dialog::backdrop{background:#0007}.modal{padding:18px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:800}.form input,.form textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit}.form textarea{min-height:75px}.check{display:flex;gap:7px;align-items:center}.check input{width:auto}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}</style></head><body><header><div><h1>Panorama Café · Administración</h1><small>Editor del catálogo comercial de pedidos</small></div></header><main><div class="note"><b>Prototipo V1:</b> permite administrar categorías y productos desde el navegador. Los cambios se guardan localmente en este dispositivo; todavía no se sincronizan entre dispositivos.</div><div class="tools"><button onclick="catForm()">+ Categoría</button><button onclick="prodForm()">+ Producto</button><button class="alt" onclick="exportar()">Exportar JSON</button><button class="alt" onclick="document.querySelector('#file').click()">Importar JSON</button><input id="file" type="file" accept="application/json" hidden onchange="importar(this)"><button class="danger" onclick="restaurar()">Restaurar inicial</button><button class="alt" onclick="location.href='../'">Ver app cliente</button></div><div class="layout"><section><h3>Categorías</h3><div id="cats"></div></section><section><div class="row"><div><h2 id="title">Catálogo</h2><div id="meta" class="muted"></div></div><button onclick="editCat()">Editar categoría</button></div><div id="items"></div></section></div></main><dialog id="dlg"><div class="modal"><h2 id="dh"></h2><div id="db"></div><div class="foot"><button class="alt" onclick="dlg.close()">Cancelar</button><button id="ok">Guardar</button></div></div></dialog><script src="../catalog-store.js"></script><script>
const KEY='panorama_catalog_v1';let data,sel;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]));const slug=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'item';
async function initial(){let a=[];for(let i=0;i<9;i++)try{let r=await fetch('../data/cat-'+i+'.json');if(r.ok)a.push(await r.json())}catch(e){}return{schemaVersion:1,categories:a}}
async function load(){try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!data)data=await initial();norm();sel=data.categories[0]?.id;render()}
function norm(){data.categories=data.categories||[];data.categories.forEach(c=>{c.id=c.id||slug(c.nombre||c.name);c.nombre=c.nombre||c.name||'Sin nombre';c.activo=c.activo!==false;c.productos=c.productos||c.products||[];c.productos.forEach(p=>{p.id=p.id||slug(p.nombre||p.name);p.nombre=p.nombre||p.name||'Sin nombre';p.activo=p.activo!==false})})}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function render(){let cts=$('cats');cts.innerHTML='';data.categories.forEach(c=>{let b=document.createElement('button');b.className=c.id===sel?'sel':'';b.innerHTML=esc(c.nombre)+(c.activo?'':' <span class="tag off">oculta</span>');b.onclick=()=>{sel=c.id;render()};cts.appendChild(b)});let c=data.categories.find(x=>x.id===sel);$('title').textContent=c?.nombre||'Catálogo';$('meta').textContent=c?c.productos.length+' productos · '+(c.activo?'visible':'oculta'):'';let box=$('items');box.innerHTML='';if(c)c.productos.forEach(p=>{let d=document.createElement('div');d.className='item';let vs=p.variantes||p.variants||[],pr=vs.map(v=>v.precio??v.price).filter(x=>x!=null);if(!pr.length&&p.precio!=null)pr=[p.precio];d.innerHTML='<div class="row"><div><b>'+esc(p.nombre)+'</b><div class="muted">'+esc(p.descripcion||'Sin descripción')+'</div></div><div>'+(p.activo?'<span class="tag">Activo</span>':'<span class="tag off">Oculto</span>')+(p.requiereEdad?'<span class="tag">18+</span>':'')+'</div></div><div class="price">'+(pr.length?'$'+Math.min(...pr)+(Math.max(...pr)!=Math.min(...pr)?' – $'+Math.max(...pr):''):'Precio por confirmar')+'</div><div class="actions"><button onclick="prodForm(\''+c.id+'\',\''+p.id+'\')">Editar</button><button class="alt" onclick="toggle(\''+c.id+'\',\''+p.id+'\')">'+(p.activo?'Ocultar':'Activar')+'</button><button class="alt" onclick="delProd(\''+c.id+'\',\''+p.id+'\')">Eliminar</button></div>';box.appendChild(d)})}
function modal(h,html,fn){$('dh').textContent=h;$('db').innerHTML=html;$('ok').onclick=()=>{fn();dlg.close()};dlg.showModal()}
function catForm(){modal('Nueva categoría','<div class="form"><label>Nombre<input id="n"></label><label>Descripción<textarea id="d"></textarea></label><label class="check"><input id="a" type="checkbox" checked> Visible en la app</label></div>',()=>{let id=slug($('n').value);if(data.categories.some(c=>c.id===id))id+='-'+Date.now();data.categories.push({id,nombre:$('n').value.trim()||'Nueva categoría',descripcion:$('d').value.trim(),activo:$('a').checked,productos:[]});sel=id;save()})}
function editCat(){let c=data.categories.find(x=>x.id===sel);if(!c)return;modal('Editar categoría','<div class="form"><label>Nombre<input id="n" value="'+esc(c.nombre)+'"></label><label>Descripción<textarea id="d">'+esc(c.descripcion||'')+'</textarea></label><label class="check"><input id="a" type="checkbox" '+(c.activo?'checked':'')+'> Visible en la app</label></div>',()=>{c.nombre=$('n').value.trim()||c.nombre;c.descripcion=$('d').value.trim();c.activo=$('a').checked;save()})}
function prodForm(cid,pid){let c=data.categories.find(x=>x.id===(cid||sel));if(!c)return alert('Selecciona una categoría');let p=pid?c.productos.find(x=>x.id===pid):{nombre:'',id:'',descripcion:'',activo:true,requiereEdad:false,precio:''};let v=p.variantes?.[0]?.precio??p.precio??'';modal(pid?'Editar producto':'Nuevo producto','<div class="form"><label>Nombre<input id="n" value="'+esc(p.nombre)+'"></label><label>ID<input id="i" value="'+esc(p.id)+'"></label><label>Descripción<textarea id="d">'+esc(p.descripcion||'')+'</textarea></label><label>Precio único <input id="p" type="number" step="0.01" value="'+v+'"></label><label class="check"><input id="a" type="checkbox" '+(p.activo!==false?'checked':'')+'> Disponible</label><label class="check"><input id="e" type="checkbox" '+(p.requiereEdad?'checked':'')+'> Requiere confirmación de edad</label></div>',()=>{p.id=slug($('i').value||$('n').value);p.nombre=$('n').value.trim()||'Producto';p.descripcion=$('d').value.trim();p.activo=$('a').checked;p.requiereEdad=$('e').checked;if($('p').value!==''){p.precio=Number($('p').value);p.variantes=[{nombre:'Único',precio:p.precio}]}if(!pid)c.productos.push(p);save()})}
function toggle(c,p){let x=data.categories.find(a=>a.id===c).productos.find(a=>a.id===p);x.activo=!x.activo;save()}function delProd(c,p){if(confirm('¿Eliminar este producto?')){let x=data.categories.find(a=>a.id===c);x.productos=x.productos.filter(a=>a.id!==p);save()}}
function exportar(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='panorama-catalogo.json';a.click()}
function importar(i){let r=new FileReader;r.onload=()=>{try{data=JSON.parse(r.result);norm();sel=data.categories[0]?.id;save();alert('Catálogo importado')}catch(e){alert('JSON inválido')}};r.readAsText(i.files[0]);i.value=''}async function restaurar(){if(confirm('¿Restaurar el catálogo inicial y perder los cambios locales?')){data=await initial();norm();sel=data.categories[0]?.id;save()}}load();</script></body></html>
